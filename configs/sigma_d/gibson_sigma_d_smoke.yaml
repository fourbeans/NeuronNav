SEED: 123
MODEL:
  family: sigma_d
  num_categories: 17
  nsf: 32
  embedding_size: 64
  pretrained_path: pretrained_models/gibson_models/poni_seed_123.ckpt
  sigma_d:
    threshold: 0.0078125
    output_threshold: 0.00390625
    qmax: 15
    learnable_threshold: false
    power_of_two_threshold: true
DATASET:
  dset_name: gibson
  root: data/semantic_maps/gibson/semantic_maps
  fmm_dists_saved_root: data/semantic_maps/gibson/fmm_dists_123
  enable_unexp_area: true
  sequence_length: 4
  train_samples_per_epoch: 8
  val_samples_per_epoch: 4
  require_progressive_maps: true
  max_sampling_attempts: 32
OPTIM:
  lr: 0.0001
  num_total_updates: 2
  batch_size: 1
  num_workers: 1
  grad_accum_steps: 1
  grad_clip_norm: 5.0
  amp: false
  lr_sched_milestones: [1000]
  scheduler_interval: update
LOSS:
  object_weight: 1.0
  area_weight: 1.0
  temporal_weight: 0.0
  reconstruction_weight: 0.0
LOGGING:
  output_dir: dairy/sigma_d_unet_20260924/experiments/gibson_sigma_d_smoke
  log_interval: 1
  eval_interval: 1
  ckpt_interval: 1
  auto_resume: false
RUNTIME:
  deterministic: false
  cudnn_benchmark: true
  sync_batchnorm: false
